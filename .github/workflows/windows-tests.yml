# Builds and runs every test project on Windows runners.
#
# Push to net10, net10-ci, workflow_dispatch, and workflow_call (Release
# packages). Pull requests are omitted so this does not run for forks.
#
# The old single job took about 42 minutes, 31 of them in one serial
# FileSyncServer desktop step. The work is now split across parallel jobs on
# separate runners, each of which builds the same tree in the same layout
# (.github/actions/windows-test-setup):
#
# - unit: the bundle's npm tests, the native toolchain helper tests, the seven
#   module-serving / source generator / remote component / lifecycle / ticket
#   suites, and FileSyncServer headless (published Client.exe +
#   RemoteWebViewService publishNoAuth, and the production JS size check).
# - desktop (matrix): the FileSyncServer desktop and tutorial classes, split
#   into shards by test class. The tests inside FileSyncServer.Tests run one
#   at a time (DisableTestParallelization) because they share ports and the
#   interactive desktop; separate runners share neither, so shards can run at
#   the same time. The `rest` shard runs everything not named by another
#   shard or by the headless filter, so a new test class is never dropped.
#
# A newer push to the same branch cancels the run it supersedes. Release runs
# (workflow_call) and manual dispatches are never cancelled.
#
# Manual dispatch can set `suite: quick` to run only the unit job (about a
# third of the time) while iterating on a branch. Pushes and releases always
# run the full suite.
#
# FileSyncServer desktop notes:
# - The desktop tests start tutorial executables. dotnet test's parent is
#   dotnet, so Utilities.RelativeRoot is seven levels up from
#   test/FileSyncServer.Tests/bin/x64/Release/<tfm>, then
#   RemoteBlazorWebViewTutorial\... A GitHub checkout of this repo is
#   D:\a\RemoteBlazorWebView\RemoteBlazorWebView, so the tutorial has to be the
#   sibling D:\a\RemoteBlazorWebView\RemoteBlazorWebViewTutorial. actions/checkout
#   only writes inside the workspace, so the setup action checks the tutorial out
#   here and copies it to that sibling. The copy is outside this checkout, so
#   it does not see this repo's global.json; CI writes the same pin into the
#   copy (the tutorial repo is not modified). The tutorial's default BuildMode
#   is Developer, which project-references this repo. Its NuGet.config is not
#   modified. A desktop shard fails the run when a hosted runner cannot host
#   an interactive WebView2.

name: Windows tests

on:
  push:
    branches: [net10, net10-ci]
  workflow_dispatch:
    inputs:
      suite:
        description: "full runs every job. quick runs only the unit job (no desktop or tutorial tests), for iterating on a branch."
        type: choice
        default: full
        options:
          - full
          - quick
  workflow_call:

permissions:
  contents: read
  actions: write

# github.workflow is the caller's name under workflow_call, so a release run
# never shares a group with a push run. Only pushes cancel in progress.
concurrency:
  group: windows-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

env:
  # Test runs use these on every dotnet test call.
  TEST_PROPS: -c Release --no-build -p:Platform=x64 -p:EnableWindowsTargeting=true -p:GeneratePackageOnBuild=false -p:PackAsTool=false
  # The classes FileSyncServer headless runs. The desktop `rest` shard excludes them.
  HEADLESS_CLASSES: FileFetchingTests ClientCachingTests ServerCachingTests ConcurrentRequestsTests LoadTest PerformanceTests TestMisc

jobs:
  unit:
    name: Unit and headless
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/windows-test-setup
        with:
          js-tests: "true"
          publish: "true"

      - name: Test native toolchain helpers
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File test/RunTests.ToolchainTests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test module serving, source generators, and remote components
        run: |
          # All suites always run. PowerShell otherwise keeps only the last native exit code,
          # which hid EndToEnd failures when Lifecycle passed (run 40813641256).
          $failed = $false
          $props = $env:TEST_PROPS.Split(' ')
          $suites = @(
            'StaticContentCache.Tests',
            'StaticContentCache.ServiceTests',
            'RemoteBlazorWebView.SourceGenerators.Tests',
            'RemoteBlazorWebView.RemoteComponents.Tests',
            'StaticContentCache.EndToEnd.Tests',
            'RemoteWebView.Lifecycle.Tests',
            'RemoteWebView.RemoteTicket.Tests'
          )
          foreach ($suite in $suites) {
            dotnet test "test/$suite/$suite.csproj" @props `
              --logger "trx;LogFileName=$suite.trx" `
              --results-directory "TestResults/$suite"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # Client.exe is copied into the test output by the FileSyncServer.Tests
      # build. These classes drive that client and the
      # publishNoAuth server, or only check the JS bundle size.
      - name: Test FileSyncServer headless
        if: always()
        run: |
          $props = $env:TEST_PROPS.Split(' ')
          $filter = ($env:HEADLESS_CLASSES.Split(' ') | ForEach-Object { "FullyQualifiedName~$_" }) -join '|'
          dotnet test test/FileSyncServer.Tests/FileSyncServer.Tests.csproj @props `
            -p:AppendRuntimeIdentifierToOutputPath=false `
            --filter $filter `
            --logger "trx;LogFileName=FileSyncServer.Headless.trx" `
            --results-directory TestResults/FileSyncServer.Headless

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-unit
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14

  desktop:
    name: Desktop (${{ matrix.shard }})
    if: inputs.suite != 'quick'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Each shard lists the test classes it runs (matched as
        # FileSyncServer.Tests.<class>.). `rest` runs every other non-headless
        # class: Local.*, TestBlazorFormControl, TestBlazorWpfControl,
        # UrlLoadingStrategyTests, and anything added later.
        include:
          - shard: server
            classes: Remote.TestServerWpf Remote.TestServerForm
          - shard: remote-wpf
            classes: Remote.TestRemoteBlazorWpf Remote.TestRemoteBlazorDebugWpf Remote.TestRemoteEmbeddedBlazorWpf
          - shard: remote-forms
            classes: Remote.TestRemoteBlazorForm Remote.TestRemoteBlazorWinFormsDebug Remote.TestRemoteEmbeddedBlazorForm
          - shard: remote-webview
            classes: Remote.TestRemoteBlazorWebView Remote.TestRemoteEmbeddedBlazorWebView
          - shard: shared
            classes: Remote.TestSharedControlWpf Remote.TestSharedControlWinForms
          - shard: rest
            classes: ""
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/windows-test-setup
        with:
          publish: "true"
          tutorial: "true"

      # Full desktop and tutorial gate. Do not add Category!=Slow here; that filter is only for local and on-demand fast runs.
      # StartProcess gives up after 30s when a hosted session never creates a
      # main window, so a shard cannot sit in that loop until the job timeout.
      - name: Test FileSyncServer desktop and tutorial (${{ matrix.shard }})
        timeout-minutes: 50
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_CLASSES: ${{ matrix.classes }}
          # Every class a named shard runs. Keep in step with the matrix above.
          NAMED_CLASSES: >-
            Remote.TestServerWpf Remote.TestServerForm
            Remote.TestRemoteBlazorWpf Remote.TestRemoteBlazorDebugWpf Remote.TestRemoteEmbeddedBlazorWpf
            Remote.TestRemoteBlazorForm Remote.TestRemoteBlazorWinFormsDebug Remote.TestRemoteEmbeddedBlazorForm
            Remote.TestRemoteBlazorWebView Remote.TestRemoteEmbeddedBlazorWebView
            Remote.TestSharedControlWpf Remote.TestSharedControlWinForms
        run: |
          # The startup diagnostic launches the tutorial exes. A surviving
          # WebView2 browser keeps the user-data folder and then ignores
          # --remote-debugging-port for TestClicks.
          foreach ($name in 'RemoteBlazorWebViewTutorial.WpfApp', 'RemoteBlazorWebViewTutorial.WinFormsApp', 'RemoteBlazorWebViewTutorial', 'msedgewebview2') {
            Get-Process -Name $name -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          # >- folds the lists onto one line separated by spaces.
          $words = { param($s) @($s.Split([char[]]' ', [StringSplitOptions]::RemoveEmptyEntries)) }
          if ($env:SHARD -eq 'rest') {
            # Not headless, and not in any named shard.
            $terms = @(& $words $env:HEADLESS_CLASSES | ForEach-Object { "FullyQualifiedName!~$_" })
            $terms += @(& $words $env:NAMED_CLASSES | ForEach-Object { "FullyQualifiedName!~FileSyncServer.Tests.$_." })
            $filter = $terms -join '&'
          } else {
            $filter = @(& $words $env:SHARD_CLASSES | ForEach-Object { "FullyQualifiedName~FileSyncServer.Tests.$_." }) -join '|'
          }
          Write-Host "Filter: $filter"
          $props = $env:TEST_PROPS.Split(' ')
          # console verbosity=normal prints each test with its duration, so the
          # shards can be rebalanced from the log.
          dotnet test test/FileSyncServer.Tests/FileSyncServer.Tests.csproj @props `
            -p:AppendRuntimeIdentifierToOutputPath=false `
            --filter $filter `
            --logger "console;verbosity=normal" `
            --logger "trx;LogFileName=FileSyncServer.Desktop.$env:SHARD.trx" `
            --results-directory "TestResults/FileSyncServer.Desktop.$env:SHARD"
          $testExit = $LASTEXITCODE
          # A filter that matches nothing passes quietly, so a renamed class
          # would drop its tests. Fail the shard when it ran no tests.
          $trx = Get-ChildItem "TestResults/FileSyncServer.Desktop.$env:SHARD" -Filter *.trx -Recurse | Select-Object -First 1
          $total = 0
          if ($trx) { $total = [int]([xml](Get-Content $trx.FullName -Raw)).TestRun.ResultSummary.Counters.total }
          Write-Host "Shard $env:SHARD ran $total tests"
          if ($total -eq 0) { throw "Shard $env:SHARD matched no tests. Check the class names in the matrix." }
          exit $testExit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results-desktop-${{ matrix.shard }}
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
