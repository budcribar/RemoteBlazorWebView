# Builds and runs every test project on a Windows runner.
#
# Push to net11 and workflow_dispatch only. Pull requests are omitted so this
# does not run for forks.
#
# RemoteBlazorWebView is built before the projects that reference it, and before
# the tutorial. StressServer is not built: it embeds a tutorial executable.
#
# FileSyncServer.Tests splits in two:
# - Headless tests (published Client.exe + RemoteWebViewService publishNoAuth,
#   and the production JS size check) fail the job when they fail.
# - The desktop step starts tutorial executables. dotnet test's parent is dotnet,
#   so Utilities.RelativeRoot is seven levels up from
#   test/FileSyncServer.Tests/bin/x64/Release/<tfm>, then
#   RemoteBlazorWebViewTutorial\... A GitHub checkout of this repo is
#   D:\a\RemoteBlazorWebView\RemoteBlazorWebView, so the tutorial has to be the
#   sibling D:\a\RemoteBlazorWebView\RemoteBlazorWebViewTutorial. actions/checkout
#   only writes inside the workspace, so the workflow checks the tutorial out
#   here and copies it to that sibling. The copy is outside this checkout, so
#   it does not see this repo's global.json; CI writes the same pin into the
#   copy (the tutorial repo is not modified). The tutorial's default BuildMode
#   is Developer, which project-references this repo. Its NuGet.config is not
#   modified. The desktop step stays continue-on-error when a hosted runner
#   cannot host an interactive WebView2.

name: Windows tests

on:
  push:
    branches: [net11]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # global.json pins 11.0.100-rc.2.26504.105 (allowPrerelease, rollForward
      # latestMinor). The fully qualified RC 2 SDK is installed from the preview
      # channel; dotnet-quality cannot be combined with that exact version.
      # No project targets net10.0. The MAUI workload is not required: tests do
      # not build MAUI apps (ASP.NET Core packages are 11.0.0-rc.2.26504.105;
      # EditWebView vendors MAUI 11.0.100-rc.2.26513.2 sources when it runs).
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      # RunTests.ps1 builds remote.blazor.desktop.js with Node 22.3.0, yarn, and
      # webpack. protoc.exe is already in src/RemoteWebView.Blazor.JS/protoc/bin.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.3.0

      - name: Build remote.blazor.desktop.js
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          corepack enable
          corepack prepare yarn@4.3.1 --activate
          $env:PATH = "$(Resolve-Path 'src/RemoteWebView.Blazor.JS/protoc/bin');$env:PATH"
          Push-Location src/RemoteWebView.Blazor.JS
          yarn install --immutable
          # Web.JS is a nested package with no committed lockfile. Yarn 4 treats it
          # as part of this project and refuses `yarn install` there. npm installs
          # the same package.json dependencies into Web.JS/node_modules, which is
          # what Boot.Desktop.ts and the Web.JS sources import.
          Push-Location Web.JS
          npm install --no-audit --no-fund
          Pop-Location
          if (-not (Test-Path 'Web.JS/node_modules/@microsoft/dotnet-js-interop')) {
            throw 'Web.JS is missing @microsoft/dotnet-js-interop after npm install'
          }
          # npm file:../dotnet-runtime already links that package. Copying it
          # again overwrites the junction with itself on Windows.
          if (-not (Test-Path 'Web.JS/node_modules/@microsoft/dotnet-runtime/package.json')) {
            throw 'Web.JS is missing @microsoft/dotnet-runtime after npm install'
          }
          npm run build:production
          $js = Get-Item "dist/remote.blazor.desktop.js"
          Write-Host "remote.blazor.desktop.js is $($js.Length) bytes"
          Pop-Location

      - name: Restore and build test projects
        id: build
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $common = @(
            '-c', 'Release',
            '-p:Platform=x64',
            '-p:EnableWindowsTargeting=true',
            '-p:GeneratePackageOnBuild=false'
          )
          dotnet build src/RemoteBlazorWebView/RemoteBlazorWebView.csproj @common
          $projects = @(
            'src/RemoteWebView/RemoteWebView.csproj',
            'src/RemoteWebViewService/RemoteWebViewService.csproj',
            'src/EditWebView/EditWebView.csproj',
            'src/RemoteBlazorWebView.Wpf/RemoteBlazorWebView.Wpf.csproj',
            'src/RemoteBlazorWebView.WinForms/RemoteBlazorWebView.WindowsForms.csproj',
            'src/Benchmarks/FilePOC/Client/Client.csproj',
            'test/StaticContentCache.Tests/StaticContentCache.Tests.csproj',
            'test/StaticContentCache.ServiceTests/StaticContentCache.ServiceTests.csproj',
            'test/StaticContentCache.EndToEnd.Tests/StaticContentCache.EndToEnd.Tests.csproj',
            'test/RemoteWebView.Lifecycle.Tests/RemoteWebView.Lifecycle.Tests.csproj',
            'test/FileSyncServer.Tests/FileSyncServer.Tests.csproj'
          )
          foreach ($project in $projects) {
            $args = $common
            if ($project -like '*FileSyncServer.Tests*') {
              # Keep the test output at bin/x64/Release/<tfm> so ServerFixture (six
              # levels up to src/RemoteWebViewService/bin/publishNoAuth) and
              # Utilities.RelativeRoot (seven levels up, then RemoteBlazorWebView\...)
              # both resolve on the GitHub checkout layout.
              $args += '-p:AppendRuntimeIdentifierToOutputPath=false'
            }
            dotnet build $project @args
          }

      # Same publish RunTests.ps1 uses for the non-Rust server. Tests look for
      # RemoteWebViewService.exe under src/RemoteWebViewService/bin/publishNoAuth.
      - name: Publish RemoteWebViewService (NoAuthorization)
        id: publish
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet publish src/RemoteWebViewService/RemoteWebViewService.csproj `
            -c NoAuthorization `
            --self-contained true `
            -r win-x64 `
            -o src/RemoteWebViewService/bin/publishNoAuth `
            -p:EnableWindowsTargeting=true `
            -p:Platform=x64 `
            -p:GeneratePackageOnBuild=false
          New-Item -ItemType Directory -Force -Path src/RemoteWebViewService/bin/publishNoAuth/wwwroot | Out-Null
          if (-not (Test-Path 'src/RemoteWebViewService/bin/publishNoAuth/RemoteWebViewService.exe')) {
            throw 'RemoteWebViewService.exe was not published to bin/publishNoAuth'
          }

      # `dotnet dev-certs https --trust` and Import-PfxCertificate into
      # CurrentUser\Root both wait on a certificate dialog on the hosted
      # Windows image (runs 40223312855 and 40227579699). HttpClient trusts
      # LocalMachine\Root, which does not prompt for an elevated runner.
      # --check --trust only looks at CurrentUser\Root, so it is not used.
      - name: Trust the HTTPS development certificate
        timeout-minutes: 2
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $pfx = Join-Path $env:RUNNER_TEMP 'aspnet-devcert.pfx'
          dotnet dev-certs https -ep $pfx -p placeholder
          $password = ConvertTo-SecureString placeholder -Force -AsPlainText
          Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\CurrentUser\My | Out-Null
          Import-PfxCertificate -FilePath $pfx -Password $password -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          $thumbprint = (Get-PfxData -FilePath $pfx -Password $password).EndEntityCertificates[0].Thumbprint
          $trusted = Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $thumbprint
          if (-not $trusted) { throw "Dev cert $thumbprint is not in LocalMachine\Root" }

      # Main build already succeeded (this step is skipped otherwise). The
      # tutorial net11 apps default to Developer mode and reference
      # ..\..\RemoteBlazorWebView\src\..., which is this checkout once the
      # tutorial tree sits next to it. NuGet.config in the tutorial repo is
      # left as committed, including its local PeakSWC source. That directory
      # is created empty so restore can see it; Developer mode does not read
      # packages from it.
      - name: Checkout tutorial (net11)
        if: steps.build.outcome == 'success'
        uses: actions/checkout@v4
        with:
          repository: budcribar/RemoteBlazorWebViewTutorial
          ref: net11
          path: _ci-tutorial
          persist-credentials: false

      - name: Publish tutorial apps
        if: steps.build.outcome == 'success'
        timeout-minutes: 40
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # windows-latest also has a stable SDK. A preview SDK is ignored
          # unless global.json sets allowPrerelease. The sibling tree has no
          # global.json of its own.
          $env:DOTNET_ROLL_FORWARD_TO_PRERELEASE = '1'
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'RemoteBlazorWebViewTutorial'
          if (Test-Path $dest) { Remove-Item $dest -Recurse -Force }
          Copy-Item -Path _ci-tutorial -Destination $dest -Recurse
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'global.json') -Destination (Join-Path $dest 'global.json') -Force
          Write-Host "dotnet $(dotnet --version)"
          dotnet --list-sdks
          # The committed local source does not exist on the runner. Creating
          # the directory does not change NuGet.config and does not publish packages.
          New-Item -ItemType Directory -Force -Path 'C:\Users\budcr\source\repos\RemoteBlazorWebView\artifacts' | Out-Null
          $common = @('-p:Platform=x64', '-p:EnableWindowsTargeting=true', '-p:GeneratePackageOnBuild=false')
          $apps = @(
            @{
              Project = 'RemoteBlazorWebViewTutorial.WinFormsApp\RemoteBlazorWebViewTutorial.WinFormsApp.csproj'
              Exe = 'RemoteBlazorWebViewTutorial.WinFormsApp.exe'
              DebugTfm = 'net11.0-windows'
            },
            @{
              Project = 'RemoteBlazorWebViewTutorial.WpfApp\RemoteBlazorWebViewTutorial.WpfApp.csproj'
              Exe = 'RemoteBlazorWebViewTutorial.WpfApp.exe'
              DebugTfm = 'net11.0-windows10.0.17763.0'
            },
            @{
              Project = 'RemoteBlazorWebViewTutorial\RemoteBlazorWebViewTutorial.csproj'
              Exe = 'RemoteBlazorWebViewTutorial.exe'
              DebugTfm = 'net11.0-windows'
            }
          )
          foreach ($app in $apps) {
            $project = Join-Path $dest $app.Project
            $dir = Split-Path $project
            $publish = Join-Path $dir 'bin\publish'
            $embeddedOut = Join-Path $dir 'bin\publishEmbedded'
            Write-Host "Publish Release $($app.Project)"
            dotnet publish $project -c Release --self-contained true -r win-x64 -o $publish @common
            # WPF mixed-mode assemblies are extracted from the exe on startup, so
            # the publish folder is the exe plus wwwroot. WinForms and Photino
            # already published that way.
            Get-ChildItem $publish -Force | Where-Object { $_.Name -ne 'wwwroot' -and $_.Extension -ne '.exe' } | Remove-Item -Recurse -Force
            $www = Join-Path $publish 'wwwroot'
            if (-not (Test-Path $www)) { throw "Publish did not produce wwwroot at $www" }
            $publishLeftover = @(Get-ChildItem $publish -Force | Where-Object { $_.Name -ne 'wwwroot' -and $_.Extension -ne '.exe' })
            if ($publishLeftover.Count -gt 0) { throw "Publish folder is not exe + wwwroot ($($app.Exe)): $($publishLeftover.Name -join ', ')" }
            $embeddedWww = Join-Path $dir 'embedded\wwwroot'
            New-Item -ItemType Directory -Force -Path $embeddedWww | Out-Null
            Copy-Item (Join-Path $www '*') $embeddedWww -Recurse -Force
            Write-Host "Publish Embedded $($app.Project)"
            dotnet publish $project -c Embedded --self-contained true -r win-x64 -o $embeddedOut @common
            Get-ChildItem $embeddedOut -Force | Where-Object { $_.Extension -ne '.exe' } | Remove-Item -Recurse -Force
            $embeddedLeftover = @(Get-ChildItem $embeddedOut -Force | Where-Object { $_.Extension -ne '.exe' })
            if ($embeddedLeftover.Count -gt 0) { throw "Embedded publish is not exe-only ($($app.Exe)): $($embeddedLeftover.Name -join ', ')" }
            Write-Host "Build Debug $($app.Project)"
            dotnet build $project -c Debug @common
            $expectedDir = Join-Path $dir "bin\x64\Debug\$($app.DebugTfm)"
            $expectedExe = Join-Path $expectedDir $app.Exe
            if (-not (Test-Path $expectedExe)) {
              $debugRoot = Join-Path $dir 'bin\x64\Debug'
              $found = Get-ChildItem $debugRoot -Recurse -Filter $app.Exe -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -notmatch '\\ref\\' } |
                Select-Object -First 1
              if ($found) {
                Write-Host "Copying debug output from $($found.DirectoryName) to $expectedDir"
                New-Item -ItemType Directory -Force -Path $expectedDir | Out-Null
                Copy-Item (Join-Path $found.DirectoryName '*') $expectedDir -Recurse -Force
              }
            }
          }
          $expected = @(
            'RemoteBlazorWebViewTutorial.WinFormsApp\bin\publish\RemoteBlazorWebViewTutorial.WinFormsApp.exe',
            'RemoteBlazorWebViewTutorial.WinFormsApp\bin\publishEmbedded\RemoteBlazorWebViewTutorial.WinFormsApp.exe',
            'RemoteBlazorWebViewTutorial.WinFormsApp\bin\x64\Debug\net11.0-windows\RemoteBlazorWebViewTutorial.WinFormsApp.exe',
            'RemoteBlazorWebViewTutorial.WpfApp\bin\publish\RemoteBlazorWebViewTutorial.WpfApp.exe',
            'RemoteBlazorWebViewTutorial.WpfApp\bin\publishEmbedded\RemoteBlazorWebViewTutorial.WpfApp.exe',
            'RemoteBlazorWebViewTutorial.WpfApp\bin\x64\Debug\net11.0-windows10.0.17763.0\RemoteBlazorWebViewTutorial.WpfApp.exe',
            'RemoteBlazorWebViewTutorial\bin\publish\RemoteBlazorWebViewTutorial.exe',
            'RemoteBlazorWebViewTutorial\bin\publishEmbedded\RemoteBlazorWebViewTutorial.exe',
            'RemoteBlazorWebViewTutorial\bin\x64\Debug\net11.0-windows\RemoteBlazorWebViewTutorial.exe'
          )
          $missing = @()
          foreach ($relative in $expected) {
            $path = Join-Path $dest $relative
            if (Test-Path $path) {
              Write-Host "ok $path"
            } else {
              Write-Host "MISSING $path"
              $leaf = Split-Path $relative -Leaf
              $root = Join-Path $dest (Split-Path (Split-Path $relative))
              Get-ChildItem $root -Recurse -Filter $leaf -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "found $($_.FullName)" }
              $missing += $path
            }
          }
          if ($missing.Count -gt 0) { throw "Tutorial outputs the tests look for were not produced." }

      # The desktop tests only report the process exit code. The tutorial WPF
      # app shows that exception in a MessageBox, so this step writes it to a
      # file (startup hook) and checks Compositor / WebView2 / composition
      # separately. It does not change product code and does not fail the job.
      - name: Diagnose WPF tutorial startup
        if: steps.build.outcome == 'success'
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Continue'
          $diag = Join-Path $env:GITHUB_WORKSPACE 'wpf-crash-diag'
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $started = Get-Date
          $probeRoot = Join-Path $env:GITHUB_WORKSPACE '.github/workflows/wpf-startup-probe'
          $dest = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'RemoteBlazorWebViewTutorial'
          function Write-Layout([string]$name, [string]$relative) {
            $dir = Join-Path $dest $relative
            $out = Join-Path $diag "$name.txt"
            if (-not (Test-Path $dir)) { "MISSING $dir" | Out-File $out -Encoding utf8; Write-Host "MISSING $dir"; return }
            $rows = Get-ChildItem $dir -Force | Select-Object Name, Length, Mode
            $rows | Out-File $out -Encoding utf8
            Write-Host "---- $name ----"
            $rows | ForEach-Object { Write-Host ("{0}`t{1}`t{2}" -f $_.Mode, $_.Length, $_.Name) }
          }
          Write-Layout 'wpf-publish-files' 'RemoteBlazorWebViewTutorial.WpfApp\bin\publish'
          Write-Layout 'wpf-embedded-files' 'RemoteBlazorWebViewTutorial.WpfApp\bin\publishEmbedded'
          Write-Layout 'winforms-publish-files' 'RemoteBlazorWebViewTutorial.WinFormsApp\bin\publish'
          Write-Layout 'winforms-embedded-files' 'RemoteBlazorWebViewTutorial.WinFormsApp\bin\publishEmbedded'

          @(
            "SESSIONNAME=$env:SESSIONNAME",
            "USERNAME=$env:USERNAME",
            "USERINTERACTIVE=$([Environment]::UserInteractive)",
            "started=$($started.ToString('o'))"
          ) | Out-File (Join-Path $diag 'environment.txt') -Encoding utf8
          query.exe session 2>&1 | Out-File (Join-Path $diag 'sessions.txt') -Encoding utf8
          query.exe user 2>&1 | Out-File (Join-Path $diag 'users.txt') -Encoding utf8

          $runtimeLog = Join-Path $diag 'webview2-runtime.txt'
          $guids = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          foreach ($root in @(
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guids",
              "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guids",
              "HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guids")) {
            "---- $root ----" | Out-File $runtimeLog -Append -Encoding utf8
            if (Test-Path $root) {
              Get-ItemProperty $root | Out-File $runtimeLog -Append -Encoding utf8
            } else {
              'missing' | Out-File $runtimeLog -Append -Encoding utf8
            }
          }
          foreach ($dir in @(
              "$env:ProgramFiles\Microsoft\EdgeWebView\Application",
              "${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application")) {
            "---- $dir ----" | Out-File $runtimeLog -Append -Encoding utf8
            if (Test-Path $dir) { Get-ChildItem $dir | Out-File $runtimeLog -Append -Encoding utf8 }
            else { 'missing' | Out-File $runtimeLog -Append -Encoding utf8 }
          }

          $hookOut = Join-Path $diag 'hook'
          dotnet build (Join-Path $probeRoot 'StartupHook.csproj') -c Release -o $hookOut -p:GeneratePackageOnBuild=false --nologo *> (Join-Path $diag 'hook-build.txt')
          "hook-build-exit=$LASTEXITCODE" | Out-File (Join-Path $diag 'hook-build.txt') -Append -Encoding utf8
          $hookDll = Join-Path $hookOut 'StartupHook.dll'

          $probeOut = Join-Path $diag 'probe'
          dotnet build (Join-Path $probeRoot 'WpfStartupProbe.csproj') -c Release -o $probeOut -p:EnableWindowsTargeting=true -p:GeneratePackageOnBuild=false --nologo *> (Join-Path $diag 'probe-build.txt')
          "probe-build-exit=$LASTEXITCODE" | Out-File (Join-Path $diag 'probe-build.txt') -Append -Encoding utf8
          $probeExe = Join-Path $probeOut 'WpfStartupProbe.exe'

          function Invoke-Captured([string]$name, [string]$exe, [string[]]$argList, [switch]$UseHook) {
            $meta = Join-Path $diag "$name.meta.txt"
            $previousHooks = $env:DOTNET_STARTUP_HOOKS
            $previousLog = $env:WPF_CRASH_LOG
            try {
              if (-not (Test-Path $exe)) {
                "MISSING $exe" | Out-File $meta -Encoding utf8
                return
              }
              $stdout = Join-Path $diag "$name.stdout.txt"
              $stderr = Join-Path $diag "$name.stderr.txt"
              $dump = Join-Path $diag "$name.dmp"
              $env:DOTNET_DbgEnableMiniDump = '1'
              $env:DOTNET_DbgMiniDumpType = '1'
              $env:DOTNET_DbgMiniDumpName = $dump
              $env:DOTNET_CreateDumpDiagnostics = '1'
              if ($UseHook -and (Test-Path $hookDll)) {
                $env:DOTNET_STARTUP_HOOKS = $hookDll
                $env:WPF_CRASH_LOG = Join-Path $diag "$name.unhandled.txt"
              } else {
                Remove-Item Env:DOTNET_STARTUP_HOOKS -ErrorAction SilentlyContinue
                Remove-Item Env:WPF_CRASH_LOG -ErrorAction SilentlyContinue
              }
              $sw = [Diagnostics.Stopwatch]::StartNew()
              $p = Start-Process -FilePath $exe -ArgumentList $argList -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
              $seen = ''
              while (-not $p.HasExited -and $sw.Elapsed.TotalSeconds -lt 45) {
                try { $p.Refresh() } catch {}
                if (-not $seen -and $p.MainWindowHandle -ne [IntPtr]::Zero) { $seen = $sw.Elapsed.ToString() }
                Start-Sleep -Milliseconds 200
              }
              $killed = $false
              if (-not $p.HasExited) {
                $killed = $true
                & taskkill.exe /PID $p.Id /T /F *> (Join-Path $diag "$name.taskkill.txt")
                try { $p.WaitForExit(5000) } catch {}
              }
              try { $p.Refresh() } catch {}
              @(
                "exe=$exe",
                "args=$($argList -join ' ')",
                "elapsed=$($sw.Elapsed)",
                "windowAt=$seen",
                "killed=$killed",
                "exit=$($p.ExitCode)",
                "dump=$(Test-Path $dump)"
              ) | Out-File $meta -Encoding utf8
            } catch {
              "LAUNCH ERROR $($_.Exception)" | Out-File $meta -Encoding utf8
            } finally {
              if ($null -eq $previousHooks) { Remove-Item Env:DOTNET_STARTUP_HOOKS -ErrorAction SilentlyContinue }
              else { $env:DOTNET_STARTUP_HOOKS = $previousHooks }
              if ($null -eq $previousLog) { Remove-Item Env:WPF_CRASH_LOG -ErrorAction SilentlyContinue }
              else { $env:WPF_CRASH_LOG = $previousLog }
            }
          }

          if (Test-Path $probeExe) {
            foreach ($mode in @('compositor', 'composition', 'composition-nodrop', 'webview2', 'webview2-nodrop')) {
              Invoke-Captured "probe-$mode" $probeExe @($mode, (Join-Path $diag "probe-$mode.log"))
            }
          }

          function Invoke-Concurrent([string]$name, [string]$exe, [int]$count) {
            $log = Join-Path $diag "$name.txt"
            if (-not (Test-Path $exe)) {
              "MISSING $exe" | Out-File $log -Encoding utf8
              return
            }
            $procs = @()
            $sw = [Diagnostics.Stopwatch]::StartNew()
            for ($i = 0; $i -lt $count; $i++) {
              $p = Start-Process -FilePath $exe -ArgumentList @('-u=https://127.0.0.1:9', "-i=22222222-2222-2222-2222-22222222222$i") -WorkingDirectory (Split-Path $exe) -PassThru -RedirectStandardOutput (Join-Path $diag "$name-$i.stdout.txt") -RedirectStandardError (Join-Path $diag "$name-$i.stderr.txt")
              $procs += $p
            }
            $seen = @{}
            while ($sw.Elapsed.TotalSeconds -lt 45) {
              $pending = $false
              foreach ($p in $procs) {
                try { $p.Refresh() } catch {}
                if (-not $seen.ContainsKey($p.Id) -and $p.MainWindowHandle -ne [IntPtr]::Zero) { $seen[$p.Id] = $sw.Elapsed.ToString() }
                if (-not $p.HasExited -and -not $seen.ContainsKey($p.Id)) { $pending = $true }
              }
              if (-not $pending) { break }
              Start-Sleep -Milliseconds 200
            }
            $lines = @("exe=$exe", "count=$count", "elapsed=$($sw.Elapsed)")
            foreach ($p in $procs) {
              try { $p.Refresh() } catch {}
              $windowAt = ''
              if ($seen.ContainsKey($p.Id)) { $windowAt = $seen[$p.Id] }
              $lines += "pid=$($p.Id) windowAt=$windowAt exited=$($p.HasExited) exit=$($p.ExitCode)"
              if (-not $p.HasExited) { & taskkill.exe /PID $p.Id /T /F *> (Join-Path $diag "$name-$($p.Id).taskkill.txt") }
            }
            $extract = Join-Path $env:TEMP '.net'
            $lines += "temp=$extract"
            $lines | Out-File $log -Encoding utf8
            Write-Host ($lines -join "`n")
            if (Test-Path $extract) {
              Get-ChildItem $extract -Force | ForEach-Object { Write-Host "extract $($_.FullName)" }
              Get-ChildItem $extract -Recurse -Depth 2 -Force -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, Mode | Out-File (Join-Path $diag "$name-extract.txt") -Encoding utf8
            }
          }

          $wpfPublishExe = Join-Path $dest 'RemoteBlazorWebViewTutorial.WpfApp\bin\publish\RemoteBlazorWebViewTutorial.WpfApp.exe'
          $wpfExtract = Join-Path $env:TEMP '.net\RemoteBlazorWebViewTutorial.WpfApp'
          if (Test-Path $wpfExtract) { Remove-Item $wpfExtract -Recurse -Force }
          Invoke-Captured 'wpf-cold' $wpfPublishExe @('-u=https://127.0.0.1:9', '-i=11111111-1111-1111-1111-111111111111')
          if (Test-Path $wpfExtract) { Remove-Item $wpfExtract -Recurse -Force }
          Invoke-Concurrent 'wpf-concurrent-cold' $wpfPublishExe 3

          $launches = @(
            @{ Name = 'wpf-publish'; Exe = 'RemoteBlazorWebViewTutorial.WpfApp\bin\publish\RemoteBlazorWebViewTutorial.WpfApp.exe'; Hook = $true },
            @{ Name = 'wpf-publish-nohook'; Exe = 'RemoteBlazorWebViewTutorial.WpfApp\bin\publish\RemoteBlazorWebViewTutorial.WpfApp.exe'; Hook = $false },
            @{ Name = 'wpf-embedded'; Exe = 'RemoteBlazorWebViewTutorial.WpfApp\bin\publishEmbedded\RemoteBlazorWebViewTutorial.WpfApp.exe'; Hook = $false },
            @{ Name = 'wpf-debug'; Exe = 'RemoteBlazorWebViewTutorial.WpfApp\bin\x64\Debug\net11.0-windows10.0.17763.0\RemoteBlazorWebViewTutorial.WpfApp.exe'; Hook = $true },
            @{ Name = 'winforms-publish'; Exe = 'RemoteBlazorWebViewTutorial.WinFormsApp\bin\publish\RemoteBlazorWebViewTutorial.WinFormsApp.exe'; Hook = $true }
          )
          foreach ($launch in $launches) {
            if ($launch.Hook) {
              Invoke-Captured $launch.Name (Join-Path $dest $launch.Exe) @('-u=https://127.0.0.1:9', '-i=11111111-1111-1111-1111-111111111111') -UseHook
            } else {
              Invoke-Captured $launch.Name (Join-Path $dest $launch.Exe) @('-u=https://127.0.0.1:9', '-i=11111111-1111-1111-1111-111111111111')
            }
          }

          Start-Sleep -Seconds 3
          $events = Join-Path $diag 'application-events.txt'
          try {
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $started.AddMinutes(-1) } -ErrorAction Stop |
              Where-Object { $_.Id -in 1000, 1001, 1023, 1026 -or $_.ProviderName -match 'Runtime|Application Error|Windows Error Reporting' } |
              Select-Object -First 30 |
              ForEach-Object { "==== $($_.TimeCreated.ToString('o')) $($_.ProviderName) Id=$($_.Id) ===="; $_.Message; '' } |
              Out-File $events -Encoding utf8
          } catch {
            "Get-WinEvent failed: $($_.Exception.Message)" | Out-File $events -Encoding utf8
          }
          if (-not (Test-Path $events) -or (Get-Item $events).Length -lt 20) {
            wevtutil.exe qe Application /c:20 /rd:true /f:text *> (Join-Path $diag 'application-events-raw.txt')
          }
          exit 0

      - name: Upload WPF startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-startup-diag
          path: wpf-crash-diag/**
          if-no-files-found: warn
          retention-days: 14

      - name: Install Playwright browsers
        if: always() && steps.publish.outcome == 'success'
        run: |
          $script = Get-ChildItem -Path test/FileSyncServer.Tests/bin -Recurse -Filter playwright.ps1 | Select-Object -First 1
          if (-not $script) { throw 'playwright.ps1 was not produced by the FileSyncServer.Tests build' }
          & $script.FullName install

      - name: Test StaticContentCache and lifecycle
        if: always() && steps.publish.outcome == 'success'
        run: |
          $projects = @(
            'test/StaticContentCache.Tests/StaticContentCache.Tests.csproj',
            'test/StaticContentCache.ServiceTests/StaticContentCache.ServiceTests.csproj',
            'test/StaticContentCache.EndToEnd.Tests/StaticContentCache.EndToEnd.Tests.csproj',
            'test/RemoteWebView.Lifecycle.Tests/RemoteWebView.Lifecycle.Tests.csproj'
          )
          $failed = $false
          foreach ($project in $projects) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($project)
            dotnet test $project `
              -c Release `
              --no-build `
              -p:Platform=x64 `
              -p:EnableWindowsTargeting=true `
              -p:GeneratePackageOnBuild=false `
              --logger "trx;LogFileName=$name.trx" `
              --results-directory "TestResults/$name"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      # Client.exe is copied into the test output by the FileSyncServer.Tests
      # build (commit 36f28cf). These classes drive that client and the
      # publishNoAuth server, or only check the JS bundle size.
      - name: Test FileSyncServer headless
        if: always() && steps.publish.outcome == 'success'
        run: |
          dotnet test test/FileSyncServer.Tests/FileSyncServer.Tests.csproj `
            -c Release `
            --no-build `
            -p:Platform=x64 `
            -p:EnableWindowsTargeting=true `
            -p:GeneratePackageOnBuild=false `
            -p:AppendRuntimeIdentifierToOutputPath=false `
            --filter "FullyQualifiedName~FileFetchingTests|FullyQualifiedName~ClientCachingTests|FullyQualifiedName~ServerCachingTests|FullyQualifiedName~ConcurrentRequestsTests|FullyQualifiedName~LoadTest|FullyQualifiedName~PerformanceTests|FullyQualifiedName~TestMisc" `
            --logger "trx;LogFileName=FileSyncServer.Headless.trx" `
            --results-directory TestResults/FileSyncServer.Headless

      # Tutorial executables are published above. StartProcess gives up after
      # 30s when a hosted session never creates a main window, so this step
      # cannot sit in that loop until the job timeout. continue-on-error stays
      # while those desktop launches still cannot complete on the runner.
      # File-not-found for those executables fails the publish step above.
      - name: Test FileSyncServer desktop and tutorial (continue on error)
        if: always() && steps.publish.outcome == 'success'
        timeout-minutes: 60
        continue-on-error: true
        run: |
          # The startup diagnostic launches the tutorial exes. A surviving
          # WebView2 browser keeps the user-data folder and then ignores
          # --remote-debugging-port for TestClicks.
          foreach ($name in 'RemoteBlazorWebViewTutorial.WpfApp', 'RemoteBlazorWebViewTutorial.WinFormsApp', 'RemoteBlazorWebViewTutorial', 'msedgewebview2') {
            Get-Process -Name $name -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }
          dotnet test test/FileSyncServer.Tests/FileSyncServer.Tests.csproj `
            -c Release `
            --no-build `
            -p:Platform=x64 `
            -p:EnableWindowsTargeting=true `
            -p:GeneratePackageOnBuild=false `
            -p:AppendRuntimeIdentifierToOutputPath=false `
            --filter "FullyQualifiedName!~FileFetchingTests&FullyQualifiedName!~ClientCachingTests&FullyQualifiedName!~ServerCachingTests&FullyQualifiedName!~ConcurrentRequestsTests&FullyQualifiedName!~LoadTest&FullyQualifiedName!~PerformanceTests&FullyQualifiedName!~TestMisc" `
            --logger "trx;LogFileName=FileSyncServer.Desktop.trx" `
            --results-directory TestResults/FileSyncServer.Desktop

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 14
