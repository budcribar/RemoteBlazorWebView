# Baseline versus current, on one runner, for the in-process PerfRegression
# harness. Counts and payload sizes are the stable signal. Elapsed time and
# allocations are medians of interleaved repeats, reported as current/baseline.
#
# A slow timing stays green: WARN is a column in the step summary and the
# artifact, not a failed push. A failed build or zero samples on either side
# fails the job. The results artifact is still uploaded.

name: Performance regression

on:
  push:
    branches: [net11]
  workflow_dispatch:
    inputs:
      baseline:
        description: Git ref for the baseline (branch or SHA). origin/net10 on every line. An empty value does not select a tag.
        required: false
        default: "origin/net10"
      repeats:
        description: Interleaved repetitions of each side on this runner (1-20)
        required: false
        default: "5"
      time_tolerance:
        description: Warn when elapsedMs or allocatedBytes is slower than this fraction (0.20 = 20%)
        required: false
        default: "0.20"
      count_tolerance:
        description: Warn when a count or byte metric grows by more than this fraction (0.05 = 5%)
        required: false
        default: "0.05"

permissions:
  contents: read
  actions: write

jobs:
  perf:
    name: perf
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false

      # The default baseline is origin/net10 (net10.0). The current tree is
      # net11. Both SDKs have to be present so each worktree's global.json
      # resolves. Ubuntu's existing dotnet.yml build is not used here: it
      # invokes Yarn 1 against a Yarn 4 packageManager field.
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.3.0

      - name: Compare baseline and current
        env:
          BASELINE: ${{ inputs.baseline || 'origin/net10' }}
          REPEATS: ${{ inputs.repeats || '5' }}
          TIME_TOLERANCE: ${{ inputs.time_tolerance || '0.20' }}
          COUNT_TOLERANCE: ${{ inputs.count_tolerance || '0.05' }}
        run: bash scripts/perf-regression.sh

      - name: Upload results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression
          path: |
            perf-results/**/*.json
            perf-results/**/*.md
            perf-results/**/*.txt
            perf-results/**/*.log
          if-no-files-found: warn
          retention-days: 14
